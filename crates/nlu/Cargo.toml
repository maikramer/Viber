[package]
name = "vael-nlu"
version = "0.1.0"
edition = "2024"

[lib]
name = "vael_nlu"

[[bin]]
name = "vael-nlu"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tokenizers = "0.23"
ort = { version = "2.0.0-rc.15", features = ["download-binaries"] }
