[package]
name = "viber"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Viber — native Bevy engine for AiGameKit declarative world XML"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["gamedev", "bevy", "engine", "xml"]
categories = ["game-development"]
# O monólito fica como app/fachada transitória; os pacotes `bevy_*` são os
# publicáveis (Vael/docs/PACKAGES.md).
publish = false
exclude = ["worlds/**", "gauntlet/**", "examples/**", "target/**"]

[workspace]
# A raiz (este crate) já é membro. Os pacotes `bevy_ext_*` vivem no monorepo
# irmão `../bevy_extensions`; não são membros deste workspace.
members = []
# Path-deps dentro do checkout entram no workspace. Os testes e exemplos
# destes forks não compilam com `--workspace --all-targets`.
exclude = [
    "vendor/rerecast",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/maikramer/Viber"
authors = ["Maikeu Locatelli"]

[dependencies]
anyhow = "1.0"
# Pacotes extraídos para o monorepo irmão `../bevy_extensions`. Os aliases
# mantêm os nomes históricos (`bevy_engine_core`, `bevy_world_xml`,
# `bevy_save_slots`) nos imports do root durante a transição.
bevy_engine_core = { package = "bevy_ext_core", version = "0.1.0", path = "../bevy_extensions/crates/bevy_ext_core" }
bevy_world_xml = { package = "bevy_ext_world", version = "0.1.0", path = "../bevy_extensions/crates/bevy_ext_world" }
bevy_save_slots = { package = "bevy_ext_save", version = "0.1.0", path = "../bevy_extensions/crates/bevy_ext_save" }
# Decoder GLB (meshopt/quantização/basisu) e núcleo voxel/transvoxel.
bevy_ext_gltf = { version = "0.1.0", path = "../bevy_extensions/crates/bevy_ext_gltf" }
bevy_voxel_terrain = { version = "0.1.0", path = "../bevy_extensions/crates/bevy_voxel_terrain" }
base64 = "0.23"
# `basis-universal` transcodes the KTX2/UASTC textures the asset pipeline
# bakes into its GLBs (`KHR_texture_basisu`); without it those textures are
# "Missing data" and the whole GLB fails to load.
bevy = { version = "0.20.1", features = [
    "bevy_remote",
    "wav",
    "jpeg",
    "webp",
    "basis-universal",
    # LUTs reais do bevy: DFG (split-sum do IBL por roughness) e bluenoise
    # (SSAO/contact shadows/SSR). Sem estas features o bevy_pbr usa
    # placeholders — DFG 1×1 e noise de reserva (bevy_pbr lib.rs:274-359).
    # Estudo: docs/VISUAL_ROADMAP.md P0.1.
    "dfg_lut",
    "bluenoise_texture",
    # LTC das RectLight (Bevy 0.19+): luzes de área retangulares para
    # interiores (forge/janelas). Sem esta feature o componente não compila.
    "area_light_luts",
    # PCSS (soft shadows físicos): soft_shadow_size nas luzes — ver spawn.rs.
    # Experimental no 0.19, exigido explícito pelo bevy_pbr.
    "experimental_pbr_pcss",
    # `ScheduleData` (schedule_data::serde) alimenta a tab Sistemas do profiler
    # com os reads/writes por sistema — os mesmos dados do BRP `schedule.graph`.
    "bevy_dev_tools",
    # Highlight de seleção do editor (bridge `viber.select` → gizmo AABB).
    "bevy_gizmos",
] }
clap = { version = "4.6", features = ["derive"] }
# NLU (GLiNER2) e d1-omni (decisão): runtimes próprios no checkout irmão
# CelerAI (models/ + estudos lá). O ORT traz um binário pré-construído
# (download-binaries); sem as features a engine compila como antes.
celer-nlu = { version = "0.3.0", path = "../CelerAI/crates/nlu", optional = true }
celer-decision = { version = "0.1.0", path = "../CelerAI/crates/decision", optional = true }

image = { version = "0.25", default-features = false, features = ["png"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# config.yaml do jogo (src/config.rs) — o contrato de paths lido em runtime.
# serde_yaml está "archived" (dtolnay) mas congelado-estável e é o parser de
# referência; adoção registada em docs/CRATES.md.
serde_yaml = "0.9"

flate2 = "1"
# `async-collider` gives `Collider::from_bevy_mesh` (trimesh/convex colliders
# baked from glTF meshes); `debug-render-3d` draws collider wireframes so
# collision can be verified in a screenshot. 0.37 (2026-10-10) é a versão
# OFICIAL bevy-0.20 — o fork vendored (0.36 portado à mão) foi removido;
# sem `picking-backend`/`to-bevy-mesh` (a engine não os usa).
bevy_rapier3d = { version = "0.37", default-features = false, features = [
    "dim3",
    "async-collider",
    "debug-render-3d",
] }
# Primitivas/composições procedurais (`<Box>`/`<Cylinder>`/`<Sphere>`/…):
# meshes watertight com nível de detalhe e material PBR de gradiente. O crate
# fixa `bevy ^0.20`, a mesma versão da engine, por isso as features unificam.
# Pin EXACTO: foram 25 releases em 13 dias (0.3.x) — a API ainda muda de
# semana para semana; subir é uma decisão explícita (docs/CRATES.md).
bevy_gradmesh = "=0.3.7"

# Luau scripting runtime (`src/luau.rs`). `luau` = sandboxed Luau VM;
# `vendored` builds the VM from source (needs a C++ toolchain);
# `send` makes `Lua: Send + Sync` so `LuaScriptHost` can live in a Bevy
# `Resource` (costs ~10-20% VM perf, fine for gameplay scripts).
# NOTE(orchestrator): if the vendored C++ build of Luau fails (cmake/C++),
# swap to `features = ["lua54", "vendored"]` and adjust luau-specific
# sandbox code in `src/luau.rs` accordingly.
mlua = { version = "0.12", features = ["luau", "vendored", "send"] }
# Clipboard do botão COPIAR do profiler (`viber.profiler_cmd("copy")`) —
# texto apenas: sem `image-data` (não pagar codecs) e com Wayland.
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
meshopt = "0.7"
# Transvoxel (Eric Lengyel): marching cubes COM células de transição entre
# blocos de resolução diferente — é o que fecha a costura entre colunas de LOD
# vizinhas sem saias. Deps de runtime minúsculas (`flagset`, `num`,
# `transvoxel-data`): sem Bevy, sem nalgebra.
transvoxel = "2"
dirs = "7"
half = "2"
notify = "8"
# Navegação (docs/CRATES.md): Recast portado para Rust + pathfinding com
# evitamento local. Os três saíram no crates.io com Bevy 0.20 em 2026-10-26/27
# (bevy_rerecast 0.6, bevy_landmass 0.13, landmass_rerecast 0.4) e já não são
# vendorizados; o `rerecast` core é a única exceção (patch abaixo).
#   bevy_rerecast     — gera a navmesh a partir da geometria real (o backend
#                       de geometria é NOSSO: src/nav/backend.rs).
#   bevy_landmass     — A* sobre a navmesh + evitamento RVO entre agentes +
#                       custo por tipo de polígono (é o que faz "preferir
#                       estradas" sair de borla).
#   landmass_rerecast — a ponte entre os dois.
# Sem o editor nem o debug plugin: o `bevy_rerecast` default arrasta uma UI
# de editor que esta engine não usa.
bevy_rerecast = { version = "0.6", default-features = false, features = ["bevy_mesh"] }
bevy_landmass = "0.13"
landmass_rerecast = "0.4"
bevy_kira_audio = { version = "0.27.1", features = ["ogg", "spatial"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
naga = { version = "30.0.1", features = ["wgsl-in"] }
# Harnesses de shader (tests/common/mod.rs) compilam WESL com a MESMA versão
# que o bevy 0.20 puxa (wesl 0.6, via bevy_shader) e validam com o naga do
# wgpu 30 — uma só cópia de cada no lockfile.
wesl = "0.6.0"
tempfile = "3"

# ---------------------------------------------------------------- profiles
# Bevy/Rapier/image are unusable at `opt-level = 0`: a dev build of
# `simple-rpg` ran at 8 fps where the same world in release sits in the
# tens. Optimizing *dependencies* only keeps `viber`'s own crate fast to
# rebuild (the inner loop an agent actually pays for) while the engine,
# the physics solver and the texture decoders run at full speed.

[features]
# PCSS (soft shadows físicos): re-export da feature do bevy para os
# `#[cfg(feature = ...)]` do código da engine (spawn.rs).
# luau-jit: codegen do Luau (mlua 0.12) — chunks compilam para código nativo.
# O orçamento de script (interrupt em host.rs) é a rede de segurança;
# `VIBER_LUAU_JIT=0` volta ao interpretador no MESMO binário (A/B).
# `ai` é opt-in: o default da engine não exige o checkout irmão CelerAI.
# Quem usa `viber.nlu`/`viber.decision` liga `--features ai` (o Vael liga).
default = ["experimental_pbr_pcss", "luau-jit"]
ai = ["nlu", "decision"]
experimental_pbr_pcss = ["bevy/experimental_pbr_pcss"]
luau-jit = ["mlua/luau-jit"]
nlu = ["dep:celer-nlu"]
decision = ["dep:celer-decision"]
# DLSS Super Resolution (NVIDIA NGX, Linux/Vulkan): NÃO-default de propósito —
# o `dlss_wgpu` precisa do SDK da NVIDIA em build (`DLSS_SDK` aponta para o
# clone de github.com/NVIDIA/DLSS na tag v310.9.1, + `VULKAN_SDK` com headers
# e libclang para o bindgen). Sem isto, `cargo test/check` (CI e agentes
# paralelos) segue como hoje. O binário jogável constrói-se com
# `cargo build --release --features dlss` (ou `viber run --dlss`), e em runtime
# o gate é `VIBER_DLSS`/config.yaml (`src/dlss.rs`) — ligado por omissão
# quando a feature está compilada e a GPU suporta.
dlss = ["bevy/dlss"]

[profile.dev]
opt-level = 1
# Disco: cada binário de teste (tests/*.rs) linka o engine inteiro; com o
# debuginfo embutido eram ~2,6 GB POR binário (123 GB medidos em
# target/debug/deps, 2026-10-13). `unpacked` deixa o debuginfo nos objetos
# (partilhados) em vez de o copiar para cada executável.
split-debuginfo = "unpacked"
# E o debuginfo COMPLETO do próprio crate inflava cada geração de build
# (libviber .rlib de 783 MB, sessões incremental de 2,1 GB, .dwo a rodo — o
# target chegou a 200+ GB mesmo com o `unpacked`). line-tables-only mantém
# backtraces com ficheiro+linha e corta o grosso disso; perde-se só
# inspeção de variáveis no gdb/lldb, que o fluxo (logs/bridge) não usa.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
# Sem debuginfo nas dependências (Bevy/Rapier/wgpu): era o grosso do peso e
# ninguém faz step-debug dentro delas. Backtraces mantêm os nomes.
debug = false

[profile.release]
lto = "thin"
# codegen-units = 1 serializava TODO o codegen num core (builds release de
# 8+ min). 16 mantém o thin-LTO (perf) e paraleliza a fase cara.
codegen-units = 16

# ---------------------------------------------------------------- patches
# `rerecast` 0.5 (crates.io, 2026-10-26) ainda não traz os dois fixes de
# robustez (vendor/rerecast/VIBER_PATCH.md): uma triangulação de contorno
# falhada aborta a navmesh INTEIRA (o spawn do simple-rpg nunca teve navmesh —
# todas as criaturas em linha recta) e o comprimento das diagonais dá a volta
# em `u16` (com tiles de 256 m, qualquer diagonal acima de 255 células). O
# vendor é o 0.5.0 + só estes dois fixes; remover quando o upstream aceitar o
# equivalente.
[patch.crates-io]
rerecast = { path = "vendor/rerecast" }
